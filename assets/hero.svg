<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Build. Break. Understand. Secure.</title>
  <desc id="desc">A typographic CYVANTAS manifesto in bone white on green-black, with a jade brand signature.</desc>
  <rect width="1200" height="330" fill="#161c1a" />
  <g fill="#e3e2da" font-family="'Noto Serif', Georgia, 'Times New Roman', serif" font-size="98" letter-spacing="-3">
    <text x="48" y="122">Build. Break.</text>
    <text x="48" y="224">Understand. Secure.</text>
  </g>
  <text x="52" y="294" fill="#9fc7b8" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="2">CYVANTAS</text>
</svg>
